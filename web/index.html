    <script>
      // Light unless the trader chose dark with the Sun/Moon button (kept per
      // device). The phone's own setting is deliberately ignored. Tailwind's
      // dark styles key off the .dark class; set it before first paint.
      window.__applyTheme = function () {
        var chosen = null;
        try {
          chosen = localStorage.getItem("pocketoga.theme");
        } catch (e) {}
        var dark = chosen === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0d0d1e" : "#f7f8fc";
      };
      window.__applyTheme();
    </script>
